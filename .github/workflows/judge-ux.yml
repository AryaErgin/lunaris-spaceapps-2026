name: Validate judge-first UX
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/judge-ux.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Verify scientific engine and UX unit suites
        run: node --test tests/*.test.mjs
      - name: Verify Chrome availability
        run: command -v google-chrome && google-chrome --version
      - name: Browser experience regression
        env:
          LUNARIS_CHROME: /usr/bin/google-chrome
        run: node tests/test_experience.mjs
      - name: Interactive onboarding and context markers
        env:
          LUNARIS_CHROME: /usr/bin/google-chrome
        run: node tests/test_onboarding.mjs
      - name: Original arrival and live playback verdicts
        env:
          LUNARIS_CHROME: /usr/bin/google-chrome
        run: node tests/test_playback_verdict_browser.mjs
      - name: Preserve visual inspection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-ux-screenshots
          path: |
            progress/experience-*/**/*.png
            progress/onboarding-*/**/*.png
          if-no-files-found: warn
          retention-days: 2
